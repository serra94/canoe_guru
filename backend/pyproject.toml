[tool.poetry]
name = "canoe-guru-backend"
version = "0.1.0"
description = "Backend API for Canoe Guru"
authors = ["Thiago <thiago@example.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = "^0.115.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"
psycopg = { version = "^3.2.0", extras = ["binary"] }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
